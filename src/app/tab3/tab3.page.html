<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tab 3
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="saved-title">
    <h2>Imágenes guardadas previamente</h2>
  </div>
  <ion-grid>
    <ion-row>
      <ion-col size="6" *ngFor="let photo of photoService.photos; index as position">
        <ion-img [src]="photo.webviewPath"></ion-img>
        <ion-card-content>
          <p>{{ photo.filepath }}</p>
        </ion-card-content>
      </ion-col>
      
    </ion-row>
  </ion-grid>
</ion-content>
